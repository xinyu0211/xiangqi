<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中国象棋</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="中国象棋">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D6DDD3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="mashanzheng.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Ma Shan Zheng";src:url(mashanzheng.woff2) format("woff2");font-display:block}
:root{
  --page:#D6DDD3; --ink:#1F2622; --muted:#56615A; --panel:#E7EBE4; --rule:rgba(31,38,34,.16);
  --accent:#2F5D50; --accent-ink:#F1F4EF;
  --red:#A8261B; --black:#1E2B2A;
  --wood-a:#E9C88E; --wood-b:#D5AA68; --grid:#4A2E16; --frame:#6E4221;
  --face:#F4E6C6; --face-hi:#FFF7DE; --edge:#B88F55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#141917; --ink:#E3E8E1; --muted:#9AA59D; --panel:#1D2320; --rule:rgba(227,232,225,.14);
    --accent:#86B8A5; --accent-ink:#10231C;
  }
}
:root[data-theme="dark"]{
  --page:#141917; --ink:#E3E8E1; --muted:#9AA59D; --panel:#1D2320; --rule:rgba(227,232,225,.14);
  --accent:#86B8A5; --accent-ink:#10231C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-tap-highlight-color:transparent;
}
.app{max-width:1000px;margin:0 auto;padding:14px 10px 28px;display:grid;gap:14px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:0 4px}
h1{
  margin:0;font-family:"Ma Shan Zheng",KaiTi,STKaiti,"Kaiti SC",serif;font-weight:400;
  font-size:clamp(34px,7vw,48px);line-height:1;letter-spacing:.06em;
}
header p{margin:0;color:var(--muted);font-size:14px}
.play{display:grid;gap:10px;min-width:0}
.status{display:flex;align-items:center;gap:10px;padding:0 4px;font-size:16px;min-height:28px}
.turn-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.turn-dot.r{background:var(--red);border-color:var(--red)}
.turn-dot.b{background:var(--black);border-color:var(--black)}
.status .alert{color:#C8321F;font-weight:700;margin-right:6px}
:root[data-theme="dark"] .turn-dot.b{border-color:#9AA59D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .turn-dot.b{border-color:#9AA59D}}

.board-wrap{position:relative;width:100%;max-width:600px;margin:0 auto}
svg#board{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.grid-line{stroke:var(--grid);stroke-width:1.3}
.grid-outer{stroke:var(--grid);stroke-width:3;fill:none}
.river{font-family:"Ma Shan Zheng",KaiTi,STKaiti,serif;font-size:34px;fill:var(--grid);opacity:.78;text-anchor:middle;dominant-baseline:central}
.file-num{font-size:15px;fill:var(--grid);opacity:.75;text-anchor:middle;dominant-baseline:central;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.piece{transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.pc-body{transition:transform .15s ease;transform-box:fill-box;transform-origin:center}
.pc-shadow{fill:rgba(60,32,8,.38)}
.pc-face{fill:var(--face);stroke:var(--edge);stroke-width:1.6}
.pc-ring{fill:none;stroke-width:1.7}
.pc-char{font-family:"Ma Shan Zheng",KaiTi,STKaiti,"Kaiti SC",serif;font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:central;stroke-width:.8px;stroke-linejoin:round;paint-order:stroke}
.red .pc-ring{stroke:var(--red)} .red .pc-char{fill:var(--red);stroke:var(--red)}
.black .pc-ring{stroke:var(--black)} .black .pc-char{fill:var(--black);stroke:var(--black)}
.selected .pc-body{transform:translateY(-4px) scale(1.07)}
.selected .pc-face{fill:var(--face-hi)}
.pc-alert{fill:none;stroke:#D7372A;stroke-width:3.5;opacity:0}
.checked .pc-alert{opacity:1}
.hint-dot{fill:#2F6B55;opacity:.8}
.hint-cap{fill:none;stroke:#2F6B55;stroke-width:3.5;opacity:.9}
.last-from{fill:none;stroke:#2F6B55;stroke-width:2;opacity:.55}
.last-to{fill:none;stroke:#2F6B55;stroke-width:2.6;opacity:.8}

.result{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
}
.result.show{display:flex}
.result-card{
  background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:14px;
  padding:20px 26px;text-align:center;box-shadow:0 12px 40px rgba(20,14,6,.35);max-width:80%;
}
.result-card h2{margin:0 0 4px;font-family:"Ma Shan Zheng",KaiTi,STKaiti,serif;font-weight:400;font-size:40px;line-height:1.2}
.result-card p{margin:0 0 14px;color:var(--muted)}

.result-actions{display:flex;gap:8px;justify-content:center}
.hint-from{fill:none;stroke:#C27C0E;stroke-width:3.5;stroke-dasharray:6 5}
.hint-line{stroke:#C27C0E;stroke-width:4;stroke-linecap:round;opacity:.75}
.hint-to{fill:#C27C0E;opacity:.9}
.puzzle-head{padding:0 4px}
.puzzle-head h2{margin:0;font-family:"Ma Shan Zheng",KaiTi,STKaiti,serif;font-weight:400;font-size:30px;line-height:1.25}
.puzzle-head p{margin:2px 0 0;color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pz-solved{color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;font-size:12px;line-height:1.6}
select{
  font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:9px 10px;min-height:44px;width:100%;max-width:100%;
}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pz-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.panel{display:grid;gap:16px;align-content:start;padding:0 4px;min-width:0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions button{padding:10px 4px}
button{
  font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);
  border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px;
}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.setting{display:grid;gap:6px}
.setting .label{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:38px;padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.note{font-size:13px;color:var(--muted);min-height:1em;margin:-8px 0 0}
.record{border-top:1px solid var(--rule);padding-top:10px}
.record h2{font-size:14px;font-weight:600;margin:0 0 6px;color:var(--muted)}
.moves{
  list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto;
  font-family:KaiTi,STKaiti,"Kaiti SC","Songti SC","Noto Serif SC",serif;font-size:18px;
}
.moves li{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:6px;padding:2px 0}
.moves .n{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px;align-self:center}
.moves .rm{color:var(--red)}
:root[data-theme="dark"] .moves .rm{color:#E0705F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .moves .rm{color:#E0705F}}
.moves .empty{color:var(--muted);font-family:inherit;font-size:14px;display:block}

.sol-bar{display:grid;gap:10px;width:100%;max-width:600px;margin:0 auto}
.sol-bar[hidden]{display:none}
.seg[hidden]{display:none}
.step-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step-nav button{padding:8px 4px}
.branch-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.branch-row:empty{display:none}
.chip{min-height:38px;padding:4px 12px;border-radius:999px;font-family:KaiTi,STKaiti,"Kaiti SC","Songti SC","Noto Serif SC",serif;font-size:17px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.book-msg{background:var(--panel);border:1px solid var(--rule);border-left:4px solid #C27C0E;border-radius:10px;padding:10px 12px}
.book-msg p{margin:0}
.book-msg b{font-family:KaiTi,STKaiti,"Kaiti SC","Songti SC","Noto Serif SC",serif;font-size:18px;font-weight:400;color:var(--red)}
.book-actions{display:flex;gap:8px;flex-wrap:wrap}
.src{font-size:12px;color:var(--muted);margin:0}
.moves{position:relative}
.moves .mv{font:inherit;background:none;border:0;border-radius:6px;padding:0 5px;min-height:0;justify-self:start;cursor:pointer;line-height:1.5}
.moves .mv.future{opacity:.42}
.moves .mv.cur{background:var(--accent);color:var(--accent-ink);opacity:1}
.moves .mv sup{font-family:system-ui,sans-serif;font-size:11px;color:#C27C0E;margin-left:2px}
.moves .mv.cur sup{color:inherit}

.linkbtn{min-height:30px;padding:2px 12px;font-size:13px;border-radius:999px;margin-left:4px}
.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px}
.pal{position:relative;aspect-ratio:1;min-height:0;padding:0;border-radius:50%;background:var(--face);border:1.5px solid var(--edge);
  box-shadow:0 2px 0 rgba(60,32,8,.35);display:grid;place-items:center;line-height:1;
  font-family:"Ma Shan Zheng",KaiTi,STKaiti,"Kaiti SC",serif;font-size:clamp(20px,6vw,28px)}
.pal .ch{-webkit-text-stroke:.6px currentColor}
.pal.r{color:var(--red)} .pal.b{color:var(--black)}
.pal.full{opacity:.4}
.pal[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px;opacity:1}
.pal .cnt{position:absolute;right:-5px;bottom:-5px;font:600 11px/1 system-ui,sans-serif;background:var(--panel);color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:2px 5px;-webkit-text-stroke:0}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tools button{padding:8px 2px;min-height:40px}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.setup-go{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.editing .panel,.editing #puzzleHead{display:none !important}

@media (min-width:880px){
  .app{grid-template-columns:minmax(0,600px) minmax(260px,1fr);padding:24px 20px 40px;column-gap:28px}
  header{grid-column:1/-1}
  .panel{padding-top:38px}
}
@media (prefers-reduced-motion: reduce){.piece,.pc-body{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>中国象棋</h1>
    <p>点选己方棋子，再点落点。可对弈、自由摆棋，也可练《适情雅趣》全部 551 局古谱，并按古谱解法练习或看答案。</p>
  </header>

  <section class="play">
    <div class="puzzle-head" id="puzzleHead" hidden>
      <h2 id="pzTitle"></h2>
      <p><span id="pzGoal"></span><span class="pz-solved" id="pzSolved" hidden>已破解</span></p>
    </div>
    <div class="status" aria-live="polite"><span class="turn-dot r" id="turnDot"></span><span id="status"></span></div>
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 608 668" role="img" aria-label="象棋棋盘">
        <defs>
          <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--wood-a)"/>
            <stop offset="1" stop-color="var(--wood-b)"/>
          </linearGradient>
        </defs>
        <g id="staticLayer"></g>
        <g id="numLayer"></g>
        <g id="lastLayer"></g>
        <g id="pieceLayer"></g>
        <g id="hintLayer" pointer-events="none"></g>
      </svg>
      <div class="result" id="result">
        <div class="result-card">
          <h2 id="resultTitle"></h2>
          <p id="resultText"></p>
          <div class="result-actions">
            <button id="viewBtn">看棋盘</button>
            <button class="primary" id="againBtn">再来一局</button>
          </div>
        </div>
      </div>
    </div>
    <div class="sol-bar" id="answerBar" hidden>
      <div class="step-nav">
        <button id="stFirst">开头</button>
        <button id="stPrev">上一步</button>
        <button id="stPlay" class="primary">播放</button>
        <button id="stNext">下一步</button>
        <button id="stLast">末尾</button>
      </div>
      <div class="branch-row" id="branchRow"></div>
    </div>
    <div class="sol-bar book-msg" id="bookBar" hidden>
      <p id="bookMsg"></p>
      <div class="book-actions">
        <button id="bookUndo">撤回这步</button>
        <button class="primary" id="bookAI">继续和电脑下</button>
      </div>
    </div>
    <div class="sol-bar" id="setupBar" hidden>
      <div class="palette" id="palette"></div>
      <div class="tools" id="tools">
        <button data-tool="move">移动</button>
        <button data-tool="erase">删除</button>
        <button data-act="clear">清空</button>
        <button data-act="init">开局</button>
        <button data-act="flip">翻转</button>
      </div>
      <div class="setting">
        <span class="label">谁先走</span>
        <div class="seg" id="setupTurn"><button data-v="r">红先</button><button data-v="b">黑先</button></div>
      </div>
      <div class="setting">
        <span class="label">摆好后怎么下</span>
        <div class="seg" id="setupPlay"><button data-v="ai-r">执红对电脑</button><button data-v="ai-b">执黑对电脑</button><button data-v="pvp">双人同屏</button></div>
      </div>
      <div class="setup-go"><button id="setupCancel">取消</button><button class="primary" id="setupStart">开始下棋</button></div>
    </div>
  </section>

  <aside class="panel">
    <div class="actions">
      <button id="undoBtn">悔棋</button>
      <button id="flipBtn">翻转棋盘</button>
      <button id="setupBtn">摆棋</button>
      <button id="newBtn" class="primary">新局</button>
    </div>
    <div class="setting">
      <span class="label">玩法</span>
      <div class="seg" data-key="mode">
        <button data-v="ai">对弈电脑</button>
        <button data-v="pvp">双人同屏</button>
        <button data-v="puzzle">古谱残局</button>
      </div>
    </div>
    <div class="setting" id="sideRow">
      <span class="label">执子</span>
      <div class="seg" data-key="human">
        <button data-v="r">红方（先走）</button>
        <button data-v="b">黑方</button>
      </div>
    </div>
    <div class="setting" id="levelRow">
      <span class="label" id="levelLabel">电脑难度</span>
      <div class="seg" data-key="level">
        <button data-v="1">入门</button>
        <button data-v="2">普通</button>
        <button data-v="3">高手</button>
      </div>
    </div>
    <div class="setting" id="puzzleRow">
      <label class="label" for="pzSelect">《适情雅趣》选局　<span id="pzProgress"></span></label>
      <select id="pzSelect"></select>
      <div class="pz-nav">
        <button id="pzPrev">上一局</button>
        <button id="pzHint">提示一步</button>
        <button id="pzNext">下一局</button>
      </div>
    </div>
    <div class="setting" id="solRow">
      <span class="label">古谱解法　<span id="solInfo"></span></span>
      <div class="seg" data-key="pzMode" id="pzModeSeg">
        <button data-v="free">自己解</button>
        <button data-v="book">按谱练习</button>
        <button data-v="answer">看答案</button>
      </div>
      <p class="src" id="solSrc"></p>
    </div>
    <p class="note" id="note"></p>
    <div class="record">
      <h2 id="recTitle">棋谱</h2>
      <ol class="moves" id="moves"></ol>
    </div>
  </aside>
</div>

<script>
(function(){
"use strict";
/* ================= 规则引擎 ================= */
const NAME_P = { r:{K:'帅',A:'仕',B:'相',N:'马',R:'车',C:'炮',P:'兵'}, b:{K:'将',A:'士',B:'象',N:'马',R:'车',C:'炮',P:'卒'} };
const CN = ['','一','二','三','四','五','六','七','八','九'];
const D4 = [[1,0],[-1,0],[0,1],[0,-1]];
const DG = [[1,1],[1,-1],[-1,1],[-1,-1]];
const NJ = [[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];
const opp = s => s==='r'?'b':'r';

function initBoard(){
  const b = new Array(90).fill(null); let id = 0;
  const back = ['R','N','B','A','K','A','B','N','R'];
  for (let c=0;c<9;c++){ b[c]={s:'b',t:back[c],id:id++}; b[81+c]={s:'r',t:back[c],id:id++}; }
  [1,7].forEach(c=>{ b[18+c]={s:'b',t:'C',id:id++}; b[63+c]={s:'r',t:'C',id:id++}; });
  [0,2,4,6,8].forEach(c=>{ b[27+c]={s:'b',t:'P',id:id++}; b[54+c]={s:'r',t:'P',id:id++}; });
  return b;
}
function inPalace(s,r,c){ return c>=3 && c<=5 && (s==='r' ? r>=7 && r<=9 : r>=0 && r<=2); }

// 伪合法着法（不检查自己被将），着法编码 from*128+to
function genMoves(b, side, capOnly){
  const out = [];
  for (let i=0;i<90;i++){
    const p = b[i]; if (!p || p.s!==side) continue;
    const r = (i/9)|0, c = i%9;
    const add = (r2,c2)=>{
      if (r2<0||r2>9||c2<0||c2>8) return;
      const q = b[r2*9+c2];
      if (q && q.s===side) return;
      if (capOnly && !q) return;
      out.push(i*128 + r2*9 + c2);
    };
    switch (p.t){
      case 'K': {
        for (const [dr,dc] of D4){ const r2=r+dr, c2=c+dc; if (inPalace(side,r2,c2)) add(r2,c2); }
        const dr = side==='r' ? -1 : 1;           // 将帅对面
        for (let r2=r+dr; r2>=0 && r2<=9; r2+=dr){
          const q = b[r2*9+c];
          if (q){ if (q.t==='K') out.push(i*128 + r2*9 + c); break; }
        }
        break;
      }
      case 'A':
        for (const [dr,dc] of DG){ const r2=r+dr, c2=c+dc; if (inPalace(side,r2,c2)) add(r2,c2); }
        break;
      case 'B':
        for (const [dr,dc] of DG){
          const r2=r+2*dr, c2=c+2*dc;
          if (r2<0||r2>9||c2<0||c2>8) continue;
          if (side==='r' ? r2<5 : r2>4) continue;   // 不能过河
          if (b[(r+dr)*9 + c+dc]) continue;         // 塞象眼
          add(r2,c2);
        }
        break;
      case 'N':
        for (const [dr,dc,lr,lc] of NJ){
          const r2=r+dr, c2=c+dc;
          if (r2<0||r2>9||c2<0||c2>8) continue;
          if (b[(r+lr)*9 + c+lc]) continue;         // 蹩马腿
          add(r2,c2);
        }
        break;
      case 'R':
        for (const [dr,dc] of D4){
          let r2=r+dr, c2=c+dc;
          while (r2>=0&&r2<=9&&c2>=0&&c2<=8){
            const q=b[r2*9+c2];
            if (!q){ if(!capOnly) out.push(i*128+r2*9+c2); }
            else { if (q.s!==side) out.push(i*128+r2*9+c2); break; }
            r2+=dr; c2+=dc;
          }
        }
        break;
      case 'C':
        for (const [dr,dc] of D4){
          let r2=r+dr, c2=c+dc, screen=false;
          while (r2>=0&&r2<=9&&c2>=0&&c2<=8){
            const q=b[r2*9+c2];
            if (!screen){
              if (!q){ if(!capOnly) out.push(i*128+r2*9+c2); }
              else screen=true;
            } else if (q){
              if (q.s!==side) out.push(i*128+r2*9+c2);
              break;
            }
            r2+=dr; c2+=dc;
          }
        }
        break;
      case 'P': {
        const f = side==='r' ? -1 : 1;
        add(r+f, c);
        if (side==='r' ? r<=4 : r>=5){ add(r,c-1); add(r,c+1); }
        break;
      }
    }
  }
  return out;
}
function makeMove(b,m){ const f=m>>7, t=m&127, cap=b[t]; b[t]=b[f]; b[f]=null; return cap; }
function unmakeMove(b,m,cap){ const f=m>>7, t=m&127; b[f]=b[t]; b[t]=cap; }
function findKing(b,s){ for (let i=0;i<90;i++){ const p=b[i]; if (p&&p.t==='K'&&p.s===s) return i; } return -1; }
function inCheck(b,s){
  const k=findKing(b,s); if (k<0) return true;
  const ms=genMoves(b,opp(s),true);
  for (const m of ms) if ((m&127)===k) return true;
  return false;
}
function legalMoves(b,s){
  const res=[];
  for (const m of genMoves(b,s,false)){
    const cap=makeMove(b,m);
    if (!inCheck(b,s)) res.push(m);
    unmakeMove(b,m,cap);
  }
  return res;
}

/* ================= 记谱 ================= */
function fileNum(s,c){ return s==='r' ? 9-c : c+1; }
function numStr(s,n){ return s==='r' ? CN[n] : String(n); }
function notation(b,m){
  const f=m>>7, t=m&127, p=b[f], s=p.s;
  const r1=(f/9)|0, c1=f%9, r2=(t/9)|0, c2=t%9;
  const nm = NAME_P[s][p.t];
  let head = nm + numStr(s, fileNum(s,c1));
  if (p.t!=='K'){
    const same=[];
    for (let r=0;r<10;r++){ const q=b[r*9+c1]; if (q&&q.s===s&&q.t===p.t) same.push(r); }
    if (same.length>=2){
      same.sort((a,z)=> s==='r' ? a-z : z-a);
      const k = same.indexOf(r1);
      const tag = same.length===2 ? ['前','后'][k] : same.length===3 ? ['前','中','后'][k] : ['一','二','三','四','五'][k];
      head = tag + nm;
    }
  }
  let dir, n;
  if (r1===r2){ dir='平'; n=fileNum(s,c2); }
  else {
    const fwd = s==='r' ? r1-r2 : r2-r1;
    dir = fwd>0 ? '进' : '退';
    n = (p.t==='N'||p.t==='B'||p.t==='A') ? fileNum(s,c2) : Math.abs(r2-r1);
  }
  return head + dir + numStr(s,n);
}

/* ================= 禁止长打（长将、长捉） ================= */
function posKey(b,side){ let s=side; for (let i=0;i<90;i++){ const p=b[i]; s+= p ? (p.s==='r'?p.t:p.t.toLowerCase()) : '.'; } return s; }
// side 方刚走完 m（b 为走后局面）：这步是否“打”——将军，或捉子
function isAttackMove(b,m,side){
  const o=opp(side);
  if (inCheck(b,o)) return true;
  const t=m&127, p=b[t];
  if (!p || p.t==='K' || p.t==='P') return false;          // 将帅、兵卒捉子不算
  for (const c of genMoves(b,side,true)){
    if ((c>>7)!==t) continue;
    const to=c&127, q=b[to], row=(to/9)|0;
    if (q.t==='K') continue;
    if (q.t==='P' && !(o==='r' ? row<=4 : row>=5)) continue;  // 未过河的兵卒不算
    const cap=makeMove(b,c);
    const ok=!inCheck(b,side);                                 // 真能吃到
    const guarded = ok && legalMoves(b,o).some(r=>(r&127)===to);
    unmakeMove(b,c,cap);
    if (ok && (!guarded || (q.t==='R' && (p.t==='N'||p.t==='C')))) return true;  // 捉无根子，或马炮捉车
  }
  return false;
}
// 当前局面下，moves 中哪些着法会构成“长将/长捉”：走后局面与之前重复，且这段循环里本方每步都在将或捉（对方不是同样每步都打）
function bannedMoves(b,side,moves){
  const banned=new Set();
  if (!history.length) return banned;
  const sb=startPosition(); let sd=startTurn();
  const keys=[posKey(sb,sd)], tags=[];
  for (const h of history){ makeMove(sb,h.m); tags.push(isAttackMove(sb,h.m,sd)); sd=opp(sd); keys.push(posKey(sb,sd)); }
  const n=history.length;
  for (const m of moves){
    const cap=makeMove(b,m);
    const j=keys.lastIndexOf(posKey(b,opp(side)));
    const atk = j>=0 && isAttackMove(b,m,side);
    unmakeMove(b,m,cap);
    if (!atk) continue;
    let mine=true, theirs=true;
    for (let i=j;i<n;i++){
      const mover = i%2 ? opp(startTurn()) : startTurn();
      if (mover===side){ if (!tags[i]) mine=false; } else if (!tags[i]) theirs=false;
    }
    if (mine && !theirs) banned.add(m);
  }
  return banned;
}

/* ================= 电脑 AI ================= */
const VAL = {K:0,A:200,B:200,N:400,R:900,C:450,P:100};
const OV  = {K:10000,R:900,C:450,N:400,A:200,B:200,P:100};
const MATE = 100000, INF = 1e9, ABORT = {};
const LEVELS = { 1:{depth:1,time:500,noise:90}, 2:{depth:3,time:1500,noise:12}, 3:{depth:8,time:3000,noise:0} };
let nodes=0, deadline=0, killers=[], hist=new Int32Array(90*128);

function evaluate(b){
  let sc=0;
  for (let i=0;i<90;i++){
    const p=b[i]; if (!p) continue;
    const r=(i/9)|0, c=i%9, adv = p.s==='r' ? 9-r : r;
    let v = VAL[p.t];
    switch (p.t){
      case 'P':
        if (adv>=5) v += 70 + (adv<=8 ? (adv-5)*14 : -15) + (4-Math.abs(c-4))*7;
        else if (c===4) v += 10;
        break;
      case 'N': v += 24 - 6*Math.abs(c-4) + Math.min(adv,7)*6 - (adv===0?18:0); break;
      case 'R': v += Math.min(adv,7)*4 + ((c===0||c===8)&&adv===0 ? -12 : 4); break;
      case 'C': v += (c===4?18:0) + (adv>=2&&adv<=6?6:0); break;
    }
    sc += p.s==='r' ? v : -v;
  }
  return sc;
}
function orderMoves(b,ms,ply){
  const k = killers[ply] || [];
  const keys = new Array(ms.length);
  for (let j=0;j<ms.length;j++){
    const m=ms[j], v=b[m&127];
    keys[j] = v ? 2e6 + OV[v.t]*16 - OV[b[m>>7].t]
            : m===k[0] ? 1.5e6 : m===k[1] ? 1.4e6 : Math.min(hist[m],1e6);
  }
  const ix = ms.map((_,j)=>j).sort((a,z)=>keys[z]-keys[a]);
  const cp = ms.slice(); for (let j=0;j<ms.length;j++) ms[j]=cp[ix[j]];
}
function qsearch(b,side,alpha,beta,qd){
  if ((++nodes & 2047)===0 && Date.now()>deadline) throw ABORT;
  const stand = (side==='r'?1:-1)*evaluate(b);
  if (stand>=beta) return stand;
  if (stand>alpha) alpha=stand;
  if (qd<=0) return stand;
  const ms=genMoves(b,side,true); orderMoves(b,ms,63);
  for (const m of ms){
    if (b[m&127].t==='K') return MATE;
    const cap=makeMove(b,m);
    const sc=-qsearch(b,opp(side),-beta,-alpha,qd-1);
    unmakeMove(b,m,cap);
    if (sc>=beta) return sc;
    if (sc>alpha) alpha=sc;
  }
  return alpha;
}
function search(b,side,depth,alpha,beta,ply){
  if (depth<=0){
    if (ply<12 && inCheck(b,side)) depth=1;   // 被将军时延伸一步
    else return qsearch(b,side,alpha,beta,6);
  }
  if ((++nodes & 2047)===0 && Date.now()>deadline) throw ABORT;
  const ms=genMoves(b,side,false); orderMoves(b,ms,ply);
  let best = -MATE+ply;
  for (const m of ms){
    const tgt=b[m&127];
    if (tgt && tgt.t==='K') return MATE-ply;
    const cap=makeMove(b,m);
    const sc=-search(b,opp(side),depth-1,-beta,-alpha,ply+1);
    unmakeMove(b,m,cap);
    if (sc>best) best=sc;
    if (sc>alpha) alpha=sc;
    if (alpha>=beta){
      if (!cap){
        const k = killers[ply] || (killers[ply]=[0,0]);
        if (k[0]!==m){ k[1]=k[0]; k[0]=m; }
        hist[m] += depth*depth;
      }
      break;
    }
  }
  return best;
}
function think(b0,side,level,banned){
  const cfg = LEVELS[level];
  const b = b0.slice();
  let legal = legalMoves(b,side);
  if (!legal.length) return null;
  if (banned && banned.size){ const ok=legal.filter(m=>!banned.has(m)); if (ok.length) legal=ok; }   // 不走长将、长捉
  if (legal.length===1) return legal[0];
  deadline = Date.now()+cfg.time; nodes=0; killers=[]; hist.fill(0);
  orderMoves(b,legal,0);
  let best = legal[0];
  for (let d=1; d<=cfg.depth; d++){
    let alpha=-INF, iterBest=null, iterScore=-INF;
    try {
      for (const m of legal){
        const cap=makeMove(b,m);
        let sc = -search(b,opp(side),d-1,-INF, cfg.noise ? INF : -alpha, 1);
        unmakeMove(b,m,cap);
        if (cfg.noise) sc += Math.random()*cfg.noise;
        if (sc>iterScore){ iterScore=sc; iterBest=m; }
        if (!cfg.noise && sc>alpha) alpha=sc;
      }
    } catch(e){
      if (e!==ABORT) throw e;
      if (d===1 && iterBest!=null) best=iterBest;
      break;
    }
    best = iterBest;
    legal.splice(legal.indexOf(best),1); legal.unshift(best);
    if (iterScore > MATE-100) break;
    if (Date.now() > deadline - cfg.time*0.4) break;  // 剩余时间不够再深一层
  }
  return best;
}

function parseFEN(pos){
  const b=new Array(90).fill(null); let id=0;
  pos.split('/').forEach((row,r)=>{
    let c=0;
    for (const ch of row){
      if (ch>='0' && ch<='9'){ c+=Number(ch); continue; }
      const up=ch.toUpperCase();
      b[r*9+c]={s: ch===up?'r':'b', t: up==='H'?'N':up==='E'?'B':up, id:id++}; c++;
    }
  });
  return b;
}

function decodeMoves(str){
  const a=[];
  for (let i=0;i+4<=str.length;i+=4){ const x1=+str[i], y1=+str[i+1], x2=+str[i+2], y2=+str[i+3]; a.push((y1*9+x1)*128 + y2*9+x2); }
  return a;
}
function samePrefix(ms,ln,n){ if (ln.moves.length<n) return false; for (let j=0;j<n;j++) if (ln.moves[j]!==ms[j]) return false; return true; }

const solCache=new Map();
function getSol(i){
  if (solCache.has(i)) return solCache.get(i);
  const raw=SOLUTIONS[PUZZLES[i][0]]; let sol=null;
  if (raw){
    const fen=puzzleFEN(i), lines=[];
    raw.l.forEach(([par,start,str],k)=>{
      const own=decodeMoves(str);
      const moves = par<0 ? own : lines[par].moves.slice(0,start-1).concat(own);
      const b=parseFEN(fen), notes=[];
      for (const m of moves){ notes.push(notation(b,m)); makeMove(b,m); }
      lines.push({k, name: k ? '变着'+k : '主线', moves, notes});
    });
    const main=lines[0].moves;
    for (const ln of lines){
      ln.alt = ln.moves.map((m,j)=>lines.some(o=>o!==ln && o.moves.length>j && o.moves[j]!==m && samePrefix(ln.moves,o,j)));
      ln.fork=0; while (ln.fork<ln.moves.length && ln.moves[ln.fork]===main[ln.fork]) ln.fork++;
    }
    sol={fen, lines, fixed:!!raw.f};
  }
  solCache.set(i,sol); return sol;
}

  const rows=[];

    case 'B': return c%2===0 && (s==='r' ? [5,7,9] : [0,2,4]).includes(r) && (c%4===((r===7||r===2)?0:2));

function xy(i){

}

function drawStatic(){

  h += `<rect class="grid-outer" x="${M-7}" y="${M-7}" width="${8*S+14}" height="${9*S+14}"/>`;
  for (let r=0;r<10;r++) h += `<line class="grid-line" x1="${M}" y1="${M+r*S}" x2="${M+8*S}" y2="${M+r*S}"/>`;
  for (let c=0;c<9;c++){
    const x=M+c*S;
    if (c===0||c===8) h += `<line class="grid-line" x1="${x}" y1="${M}" x2="${x}" y2="${M+9*S}"/>`;
    else h += `<line class="grid-line" x1="${x}" y1="${M}" x2="${x}" y2="${M+4*S}"/><line class="grid-line" x1="${x}" y1="${M+5*S}" x2="${x}" y2="${M+9*S}"/>`;
  }
  const P=(r,c)=>[M+c*S,M+r*S];
  [[0,3,2,5],[0,5,2,3],[7,3,9,5],[7,5,9,3]].forEach(([r1,c1,r2,c2])=>{
    const [x1,y1]=P(r1,c1),[x2,y2]=P(r2,c2);
    h += `<line class="grid-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  });

  for (const [r,c] of marks){
    const [x,y]=P(r,c), g=5, l=10;
    for (const sx of [-1,1]){
      if ((c===0&&sx<0)||(c===8&&sx>0)) continue;
      for (const sy of [-1,1])
        h += `<polyline class="grid-line" fill="none" points="${x+sx*(g+l)},${y+sy*g} ${x+sx*g},${y+sy*g} ${x+sx*g},${y+sy*(g+l)}"/>`;
    }
  }
  h += `<text class="river" x="${M+2*S}" y="${M+4.5*S}">楚　河</text><text class="river" x="${M+6*S}" y="${M+4.5*S}">汉　界</text>`;

}
function drawNumbers(){
  const top = flipped ? 'r' : 'b', bot = opp(top);

function renderPieces(){

function bookLinesFor(ms){ const sol=curSol(); return sol ? sol.lines.filter(ln=>samePrefix(ms,ln,ms.length)) : []; }
function bookLineNext(ms){ return bookLinesFor(ms).find(ln=>ln.moves.length>ms.length) || null; }
function bookState(){
  if (pzMode()!=='book') return 'none';
  const ms=history.map(h=>h.m);
  if (!bookLinesFor(ms).length) return 'off';
  if (gameOver) return 'on';
  return bookLineNext(ms) ? 'on' : 'end';
}
const viewLine = () => curSol().lines[view.line];
function applyView(){
  const ln=viewLine();
  view.ply=Math.max(0,Math.min(ln.moves.length,view.ply));
  board=parseFEN(curSol().fen); turn='r'; history=[];
  for (let j=0;j<view.ply;j++){ const m=ln.moves[j], cap=makeMove(board,m); history.push({m,cap,note:ln.notes[j]}); turn=opp(turn); }
  lastMove = history.length ? history[history.length-1].m : null;
  selected=null; hintMove=null; updateState(); render(); save();
}
function stopAuto(){ if (autoTimer){ clearInterval(autoTimer); autoTimer=null; } }
function step(to){ stopAuto(); view.ply=to; applyView(); }
function toggleAuto(){
  if (autoTimer){ stopAuto(); renderSolUI(); return; }
  if (view.ply>=viewLine().moves.length){ view.ply=0; applyView(); }

    if (view.ply>=viewLine().moves.length){ stopAuto(); renderSolUI(); return; }

function viewAlts(){

function updateState(){

function doMove(m){

function maybeAI(){

function undo(){

function startPosition(){ return isPuzzle() ? parseFEN(puzzleFEN(settings.puzzle)) : settings.custom ? parseFEN(settings.custom.fen) : initBoard(); }

  board=startPosition(); turn=startTurn(); history=[]; selected=null; lastMove=null; hintMove=null; flashMsg='';
  flipped = settings.mode==='ai' && settings.human==='b';
  drawNumbers(); updateState(); render(); save(); maybeAI();
}
function loadPuzzle(i){
  settings.puzzle=Math.max(0,Math.min(PUZZLES.length-1,i));
  pending.mode='puzzle';
  newGame();
}

function squareAt(e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  let c=Math.round((p.x-M)/S), r=Math.round((p.y-M)/S);
  if (c<0||c>8||r<0||r>9) return -1;
  if (Math.hypot(p.x-(M+c*S), p.y-(M+r*S)) > S*0.55) return -1;
  if (flipped){ r=9-r; c=8-c; }
  return r*9+c;
}
function onBoardClick(e){
  if (editing){ const i=squareAt(e); if (i>=0) setupClick(i); return; }
  if (gameOver || thinking || inAnswer()) return;
  if (vsAI() && turn!==humanSide()) return;
  if (pzMode()==='book' && bookState()!=='on') return;
  const i=squareAt(e); if (i<0) return;
  const pc=board[i];
  if (selected!=null){
    const m=selected*128+i;
    if (legalCache.includes(m)){
      const bookLn = pzMode()==='book' ? bookLineNext(history.map(h=>h.m)) : null;
      const isBook = bookLn && bookLn.moves[history.length]===m;
      if (!isBook && bannedMoves(board,turn,[m]).has(m) && bannedMoves(board,turn,legalCache).size<legalCache.length){
        const cap=makeMove(board,m), chk=inCheck(board,opp(turn)); unmakeMove(board,m,cap);
        flashMsg = `禁止${chk?'长将':'长捉'}：这步会重复局面，请换一步`;
        selected=null; render(); return;
      }
      doMove(m); return;
    }
  }
  selected = (pc && pc.s===turn && selected!==i) ? i : null;
  renderPieces(); renderMarks();
}

/* ================= 存档 ================= */
const KEY='xiangqi-save-v1';
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({settings, pending, flipped, view, moves:history.map(h=>h.m), solved:[...solved]}));
  }catch(e){}
}
function load(){
  let data=null;
  try{ data=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if (!data || !data.settings) return false;
  Object.assign(settings, data.settings);
  Object.assign(pending, data.pending || data.settings);
  if (!(settings.puzzle>=0 && settings.puzzle<PUZZLES.length)) settings.puzzle=0;
  (data.solved||[]).forEach(i=>{ if (i>=0 && i<PUZZLES.length) solved.add(i); });
  buildSelect();
  board=startPosition(); turn=startTurn(); history=[]; selected=null; lastMove=null;
  for (const m of data.moves||[]){
    if (!legalMoves(board,turn).includes(m)) break;
    const note=notation(board,m), cap=makeMove(board,m);
    history.push({m,cap,note}); lastMove=m; turn=opp(turn);
  }
  flipped=!!data.flipped;
  drawNumbers();
  if (inAnswer()){
    const v=data.view||{};
    view = curSol().lines[v.line] ? {line:v.line, ply:v.ply|0} : {line:0, ply:0};
    applyView(); return true;
  }
  updateState(); render(); maybeAI();
  return true;
}

/* ================= 绑定 ================= */
svg.addEventListener('click', onBoardClick);
$('undoBtn').addEventListener('click', undo);
$('newBtn').addEventListener('click', newGame);
$('againBtn').addEventListener('click', ()=>{
  if (isPuzzle() && gameOver && gameOver.winner==='r' && settings.puzzle<PUZZLES.length-1) loadPuzzle(settings.puzzle+1);
  else newGame();
});
$('viewBtn').addEventListener('click', ()=>{ resultHidden=true; renderResult(); });
$('flipBtn').addEventListener('click', ()=>{ flipped=!flipped; drawNumbers(); render(); save(); });
$('pzSelect').addEventListener('change', e=>loadPuzzle(Number(e.target.value)));
$('pzPrev').addEventListener('click', ()=>loadPuzzle(settings.puzzle-1));
$('pzNext').addEventListener('click', ()=>loadPuzzle(settings.puzzle+1));
$('pzHint').addEventListener('click', showHint);
$('setupBtn').addEventListener('click', enterSetup);
$('setupCancel').addEventListener('click', cancelSetup);
$('setupStart').addEventListener('click', startFromSetup);
$('palette').addEventListener('click', e=>{
  const b=e.target.closest('.pal'); if (!b || !editing) return;
  editing.tool = editing.tool===b.dataset.p ? null : b.dataset.p;
  selected=null; editing.msg=''; render();
});
$('tools').addEventListener('click', e=>{
  const b=e.target.closest('button'); if (!b || !editing) return;
  editing.msg='';
  if (b.dataset.tool){ editing.tool = b.dataset.tool==='erase' ? 'erase' : null; selected=null; }
  else if (b.dataset.act==='clear'){ board=new Array(90).fill(null); selected=null; }
  else if (b.dataset.act==='init'){ board=freshIds(initBoard()); selected=null; }
  else if (b.dataset.act==='flip'){ flipped=!flipped; drawNumbers(); }
  render();
});
$('setupTurn').addEventListener('click', e=>{ const b=e.target.closest('button'); if (b && editing){ editing.turn=b.dataset.v; editing.msg=''; render(); } });
$('setupPlay').addEventListener('click', e=>{ const b=e.target.closest('button'); if (b && editing){ editing.play=b.dataset.v; editing.msg=''; render(); } });
$('puzzleHead').addEventListener('click', e=>{ if (e.target.id==='customReset'){ settings.custom=null; newGame(); } });
$('stFirst').addEventListener('click', ()=>step(0));
$('stPrev').addEventListener('click', ()=>step(view.ply-1));
$('stNext').addEventListener('click', ()=>step(view.ply+1));
$('stLast').addEventListener('click', ()=>step(viewLine().moves.length));
$('stPlay').addEventListener('click', toggleAuto);
$('branchRow').addEventListener('click', e=>{
  const b=e.target.closest('button'); if (!b) return;
  if (b.id==='toMain') backToMain(); else if (b.dataset.line) chooseLine(Number(b.dataset.line));
});
$('moves').addEventListener('click', e=>{ const b=e.target.closest('.mv'); if (b && inAnswer()) step(Number(b.dataset.ply)); });
$('bookUndo').addEventListener('click', undo);
$('bookAI').addEventListener('click', continueWithAI);
document.addEventListener('keydown', e=>{
  if (editing || !inAnswer() || e.target.closest('select,input,textarea')) return;
  if (e.key==='ArrowRight' && view.ply<viewLine().moves.length){ e.preventDefault(); step(view.ply+1); }
  else if (e.key==='ArrowLeft' && view.ply>0){ e.preventDefault(); step(view.ply-1); }
});
document.querySelectorAll('.seg').forEach(seg=>{
  seg.addEventListener('click', e=>{
    const b=e.target.closest('button'); if (!b) return;
    const key=seg.dataset.key, v=b.dataset.v;
    if (!key) return;
    if (key==='level'){ settings.level=Number(v); renderControls(); save(); return; }
    if (key==='pzMode'){ settings.pzMode=v; newGame(); return; }
    pending[key]=v;
    if (!history.length && !thinking) newGame(); else { renderControls(); save(); }
  });
});

drawStatic();
if (!load()){ buildSelect(); newGame(); }
})();
</script>

</script>
